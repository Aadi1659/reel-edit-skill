<template>

       push-in on the proof, coral hand-drawn ellipse circles it. Times are LOCAL (0 = host data-start).

  <style>
    @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: #f3efe8; }
    #cd-stage { position: absolute; inset: 0; perspective: 2400px; }
    #cd-card { position: absolute; left: 160px; top: 190px; width: 760px; height: 774px; border-radius: 28px; overflow: hidden; background: #fff;

    #cd-ring { position: absolute; left: 0; top: 0; width: 760px; height: 774px; overflow: visible; }

  <div id="root" data-composition-id="card" data-width="1080" data-height="1920">
    <div id="cd-stage">
      <div id="cd-card">
        <img id="cd-img" src="assets/shots/shot.png" alt="" />
        <svg id="cd-ring" viewBox="0 0 760 774"><ellipse id="cd-ell" cx="380" cy="600" rx="120" ry="40" fill="none" stroke="#d97757" stroke-width="5"
          stroke-linecap="butt" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-3 380 600)"/></svg>
      </div>
    </div>
    <div id="cd-p1" class="clip txt" data-start="0" data-duration="0.9">
      <div class="sm"><span class="w" data-t="0">small,</span></div>

      <div class="bg" style="font-size: 220px"><span class="w acc" data-t="1.3">proof.</span></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const root = document.querySelector('[data-composition-id="card"]');
    const O = "380px 600px"; // push-in origin = ellipse centre
    tl.fromTo("#cd-card", { y: 260, rotationX: 22, rotationY: 12, opacity: 0 },
      { y: 0, rotationX: 7, rotationY: 5, opacity: 1, duration: 0.46, ease: "expo.out", transformOrigin: "50% 60%" }, 0);

    tl.to("#cd-card", { scale: 1.68, duration: 0.6, ease: "none", transformOrigin: O }, 1.37);
    root.querySelectorAll(".w[data-t]").forEach((el) => {
      const t = parseFloat(el.dataset.t), big = el.closest(".bg");
      tl.fromTo(el, { opacity: 0, y: big ? 40 : 18, filter: "blur(12px)" },

    tl.to("#cd-p1", { opacity: 0, duration: 0.1 }, 0.8);
    window.__timelines["card"] = tl;
